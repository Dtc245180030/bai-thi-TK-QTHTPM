apiVersion: 1

# ==============================================================================
# GRAFANA DATASOURCE PROVISIONING
# Tự động kết nối tới Prometheus (Metrics) và Loki (Logs)
# ==============================================================================

datasources:
  # 1. Datasource Prometheus (Thu thập Metrics)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "10s"
      httpMethod: "POST"

  # 2. Datasource Loki (Thu thập Logs tập trung)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
