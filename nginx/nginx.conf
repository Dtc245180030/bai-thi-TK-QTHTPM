# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION (CHẠY ĐỊA CHỈ IP THẬT / DOMAIN / LOCALHOST)
# ==============================================================================

server {
    # Lắng nghe cổng 80 làm server mặc định cho mọi địa chỉ IP và Domain
    listen 80 default_server;
    server_name _; # Catch-all: Chấp nhận mọi IP (ví dụ: 192.168.28.128) hoặc localhost
    charset utf-8; # Bắt buộc toàn bộ response trả về UTF-8 chuẩn

    # ==========================================================================
    # 1. HARDENING: ẨN PHIÊN BẢN & GIỚI HẠN BUFFER CHỐNG TẤN CÔNG DoS / OVERFLOW
    # ==========================================================================
    server_tokens off; # Ẩn phiên bản Nginx trong header và trang lỗi

    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 32M;

    # Timeouts phòng chống tấn công Slowloris
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # Định dạng ghi log chuẩn cho Promtail thu thập
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ==========================================================================
    # 2. HARDENING: SECURITY HEADERS BẢO VỆ TOÀN DIỆN
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob: ws: wss:; connect-src 'self' ws: wss: https:;" always;

    # ==========================================================================
    # 3. NÉN GZIP TỐI ƯU HIỆU NĂNG
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ==========================================================================
    # 4. HARDENING: CHẶN TRUY CẬP FILE ẨN VÀ FILE CẤU HÌNH NHẠY CẢM
    # ==========================================================================
    # Chặn các file/thư mục ẩn bắt đầu bằng dấu chấm (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn các phần mở rộng file nhạy cảm
    location ~* \.(sql|env|bak|conf|config|yaml|yml|md|log|ini)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # 5. ROUTE: NGINX STUB STATUS (Cho Prometheus Exporter)
    # Chỉ cho phép localhost và các dải mạng nội bộ Docker / LAN
    # ==========================================================================
    location = /stub_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ==========================================================================
    # 6. ROUTE: QUẢN TRỊ phpMyAdmin (/pma/)
    # ==========================================================================
    location = /pma {
        return 301 /pma/;
    }

    location /pma/ {
        proxy_pass http://phpmyadmin:80/;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    # ==========================================================================
    # 7. ROUTE: HỆ THỐNG GIÁM SÁT GRAFANA (/grafana/)
    # ==========================================================================
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support cho Grafana Live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
    }

    # ==========================================================================
    # 8. ROUTE: ỨNG DỤNG WEB PORTFOLIO (web:80)
    # ==========================================================================
    location / {
        proxy_pass http://web:80;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 180;
        proxy_connect_timeout 180;
        proxy_send_timeout 180;
    }
}
